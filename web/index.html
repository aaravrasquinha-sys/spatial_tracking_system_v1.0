<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>poi_present</title>
  <link rel="stylesheet" href="common/tokens.css" />
  <style>
    body { display: grid; place-items: center; height: 100dvh; }
    .card {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: var(--space-6);
      width: min(420px, 88vw);
    }
    h1 {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 500;
      color: var(--text-bright);
      margin: 0 0 var(--space-1);
    }
    p.sub { color: var(--text-muted); font-size: 13px; margin: 0 0 var(--space-5); }
    a.link {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--space-3) var(--space-4);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      color: var(--text-bright);
      text-decoration: none;
      margin-bottom: var(--space-2);
      font-size: 14px;
    }
    a.link:hover { border-color: var(--state-confirmed); }
    a.link .go { color: var(--text-dim); font-family: var(--font-mono); font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>poi_present</h1>
    <p class="sub">Module 5 — pick a viewer.</p>
    <a class="link" href="dashboard/"><span>Dashboard</span><span class="go mono">2D →</span></a>
    <a class="link" href="viewer3d/"><span>3D viewer</span><span class="go mono">3D →</span></a>
    <a class="link" href="vr/"><span>WebXR viewer</span><span class="go mono">VR →</span></a>
  </div>
</body>
</html>
